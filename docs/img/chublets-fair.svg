<svg xmlns="http://www.w3.org/2000/svg" width="2140" height="439.5" viewBox="0 0 2140 439.5"><metadata xmlns:dc="http://purl.org/dc/elements/1.1/"><dc:creator>Florian Thiery</dc:creator><dc:rights>CC BY 4.0 (https://creativecommons.org/licenses/by/4.0/)</dc:rights></metadata><style>@font-face { font-family: "Fira Sans"; src: url("../fonts/FiraSans-Regular.ttf"); font-weight: 400; } @font-face { font-family: "Fira Sans"; src: url("../fonts/FiraSans-Bold.ttf"); font-weight: 700; }</style><g transform="translate(10,10)"><g transform="translate(0,0)"><rect x="0" y="0" width="500" height="419.5" rx="14" fill="#F5F9F9" stroke="#0E7A6E" stroke-width="3"/><path d="M0,66 L0,14 Q0,0 14,0 L486,0 Q500,0 500,14 L500,66 z" fill="#0E7A6E"/><rect x="18" y="15" width="36" height="36" rx="9" fill="#ffffff"/><text x="36" y="41" font-family="Fira Sans, sans-serif" font-size="24" font-weight="700" fill="#0E7A6E" text-anchor="middle">F</text><text x="70" y="42" font-family="Fira Sans, sans-serif" font-size="25" font-weight="700" fill="#ffffff" text-anchor="start">Findable</text><g transform="translate(0,66)"><rect x="22" y="22" width="456" height="93" rx="10" fill="#EBF4F3" stroke="#0E7A6E" stroke-width="2.5"/><text x="250" y="51.3" font-family="Fira Sans, sans-serif" font-size="18" font-weight="700" fill="#1E1425" text-anchor="middle">Persistent identifiers</text><text x="250" y="77.5" font-family="Fira Sans, sans-serif" font-size="15.5" fill="#1E1425" text-anchor="middle">every one of the 826 items has a Q-ID</text><text x="250" y="99" font-family="Fira Sans, sans-serif" font-size="15.5" fill="#1E1425" text-anchor="middle">stated Wikidata items are linked by federation</text><path d="M250,117 L250,130" fill="none" stroke="#0E7A6E" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M250,139 L244.15,126 L255.85,126 z" fill="#0E7A6E"/><rect x="22" y="141" width="456" height="71.5" rx="10" fill="#EBF4F3" stroke="#0E7A6E" stroke-width="2.5"/><text x="250" y="170.3" font-family="Fira Sans, sans-serif" font-size="18" font-weight="700" fill="#1E1425" text-anchor="middle">Registries</text><text x="250" y="196.5" font-family="Fira Sans, sans-serif" font-size="15.5" fill="#1E1425" text-anchor="middle">indexed by nfdi.software and find.software</text><path d="M250,214.5 L250,227.5" fill="none" stroke="#0E7A6E" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M250,236.5 L244.15,223.5 L255.85,223.5 z" fill="#0E7A6E"/><rect x="22" y="238.5" width="456" height="71.5" rx="10" fill="#D8E9E7" stroke="#0E7A6E" stroke-width="2.5"/><text x="250" y="267.8" font-family="Fira Sans, sans-serif" font-size="18" font-weight="700" fill="#1E1425" text-anchor="middle">Found by</text><text x="250" y="294" font-family="Fira Sans, sans-serif" font-size="15.5" fill="#1E1425" text-anchor="middle">Q-ID, SPARQL query and cross-domain search</text></g></g>
<g transform="translate(540,0)"><rect x="0" y="0" width="500" height="419.5" rx="14" fill="#F7F6F7" stroke="#3B1F4A" stroke-width="3"/><path d="M0,66 L0,14 Q0,0 14,0 L486,0 Q500,0 500,14 L500,66 z" fill="#3B1F4A"/><rect x="18" y="15" width="36" height="36" rx="9" fill="#ffffff"/><text x="36" y="41" font-family="Fira Sans, sans-serif" font-size="24" font-weight="700" fill="#3B1F4A" text-anchor="middle">A</text><text x="70" y="42" font-family="Fira Sans, sans-serif" font-size="25" font-weight="700" fill="#ffffff" text-anchor="start">Accessible</text><g transform="translate(0,66)"><rect x="22" y="22" width="456" height="71.5" rx="10" fill="#EFEDF0" stroke="#3B1F4A" stroke-width="2.5"/><text x="250" y="51.3" font-family="Fira Sans, sans-serif" font-size="18" font-weight="700" fill="#1E1425" text-anchor="middle">Wikibase API and SPARQL endpoint</text><text x="250" y="77.5" font-family="Fira Sans, sans-serif" font-size="15.5" fill="#1E1425" text-anchor="middle">open protocols, the same for every client</text><path d="M250,95.5 L250,108.5" fill="none" stroke="#3B1F4A" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M250,117.5 L244.15,104.5 L255.85,104.5 z" fill="#3B1F4A"/><rect x="22" y="119.5" width="456" height="71.5" rx="10" fill="#EFEDF0" stroke="#3B1F4A" stroke-width="2.5"/><text x="250" y="148.8" font-family="Fira Sans, sans-serif" font-size="18" font-weight="700" fill="#1E1425" text-anchor="middle">No login for reading</text><text x="250" y="175" font-family="Fira Sans, sans-serif" font-size="15.5" fill="#1E1425" text-anchor="middle">a login only gates writing</text><path d="M250,193 L250,206" fill="none" stroke="#3B1F4A" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M250,215 L244.15,202 L255.85,202 z" fill="#3B1F4A"/><rect x="22" y="217" width="456" height="71.5" rx="10" fill="#DFDBE2" stroke="#3B1F4A" stroke-width="2.5"/><text x="250" y="246.3" font-family="Fira Sans, sans-serif" font-size="18" font-weight="700" fill="#1E1425" text-anchor="middle">Static pages as well</text><text x="250" y="272.5" font-family="Fira Sans, sans-serif" font-size="15.5" fill="#1E1425" text-anchor="middle">the same CSV model is published as static pages</text></g></g>
<g transform="translate(1080,0)"><rect x="0" y="0" width="500" height="419.5" rx="14" fill="#FCFAF6" stroke="#B8862E" stroke-width="3"/><path d="M0,66 L0,14 Q0,0 14,0 L486,0 Q500,0 500,14 L500,66 z" fill="#B8862E"/><rect x="18" y="15" width="36" height="36" rx="9" fill="#ffffff"/><text x="36" y="41" font-family="Fira Sans, sans-serif" font-size="24" font-weight="700" fill="#B8862E" text-anchor="middle">I</text><text x="70" y="42" font-family="Fira Sans, sans-serif" font-size="25" font-weight="700" fill="#ffffff" text-anchor="start">Interoperable</text><g transform="translate(0,66)"><rect x="22" y="22" width="456" height="93" rx="10" fill="#F3EBDD" stroke="#B8862E" stroke-width="2.5"/><text x="250" y="51.3" font-family="Fira Sans, sans-serif" font-size="18" font-weight="700" fill="#1E1425" text-anchor="middle">CodeMeta</text><text x="250" y="77.5" font-family="Fira Sans, sans-serif" font-size="15.5" fill="#1E1425" text-anchor="middle">83 terms mapped to properties of the Wikibase</text><text x="250" y="99" font-family="Fira Sans, sans-serif" font-size="15.5" fill="#1E1425" text-anchor="middle">the pivot between the vocabularies</text><path d="M250,117 L84.12,145.48" fill="none" stroke="#B8862E" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M75.25,147 L87.07,139.03 L89.05,150.57 z" fill="#B8862E"/><rect x="22" y="149" width="106.5" height="46" rx="10" fill="#F9F5EE" stroke="#B8862E" stroke-width="2.5"/><text x="75.25" y="178" font-family="Fira Sans, sans-serif" font-size="16" font-weight="700" fill="#1E1425" text-anchor="middle">Wikidata</text><path d="M250,117 L199.75,142.88" fill="none" stroke="#B8862E" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M191.75,147 L200.63,135.85 L205.99,146.25 z" fill="#B8862E"/><rect x="138.5" y="149" width="106.5" height="46" rx="10" fill="#F9F5EE" stroke="#B8862E" stroke-width="2.5"/><text x="191.75" y="178" font-family="Fira Sans, sans-serif" font-size="16" font-weight="700" fill="#1E1425" text-anchor="middle">DCAT</text><path d="M250,117 L300.25,142.88" fill="none" stroke="#B8862E" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M308.25,147 L294.01,146.25 L299.37,135.85 z" fill="#B8862E"/><rect x="255" y="149" width="106.5" height="46" rx="10" fill="#F9F5EE" stroke="#B8862E" stroke-width="2.5"/><text x="308.25" y="178" font-family="Fira Sans, sans-serif" font-size="16" font-weight="700" fill="#1E1425" text-anchor="middle">DataCite</text><path d="M250,117 L415.88,145.48" fill="none" stroke="#B8862E" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M424.75,147 L410.95,150.57 L412.93,139.03 z" fill="#B8862E"/><rect x="371.5" y="149" width="106.5" height="46" rx="10" fill="#F9F5EE" stroke="#B8862E" stroke-width="2.5"/><text x="424.75" y="178" font-family="Fira Sans, sans-serif" font-size="16" font-weight="700" fill="#1E1425" text-anchor="middle">CFF</text><text x="250" y="219" font-family="Fira Sans, sans-serif" font-size="14" fill="#5B5568" text-anchor="middle">each pair is mapped through CodeMeta, not one by one</text></g></g>
<g transform="translate(1620,0)"><rect x="0" y="0" width="500" height="419.5" rx="14" fill="#F6F8FA" stroke="#2A5F8A" stroke-width="3"/><path d="M0,66 L0,14 Q0,0 14,0 L486,0 Q500,0 500,14 L500,66 z" fill="#2A5F8A"/><rect x="18" y="15" width="36" height="36" rx="9" fill="#ffffff"/><text x="36" y="41" font-family="Fira Sans, sans-serif" font-size="24" font-weight="700" fill="#2A5F8A" text-anchor="middle">R</text><text x="70" y="42" font-family="Fira Sans, sans-serif" font-size="25" font-weight="700" fill="#ffffff" text-anchor="start">Reusable</text><g transform="translate(0,66)"><rect x="22" y="22" width="456" height="93" rx="10" fill="#EDF2F5" stroke="#2A5F8A" stroke-width="2.5"/><text x="250" y="51.3" font-family="Fira Sans, sans-serif" font-size="18" font-weight="700" fill="#1E1425" text-anchor="middle">Licence</text><text x="250" y="77.5" font-family="Fira Sans, sans-serif" font-size="15.5" fill="#1E1425" text-anchor="middle">copyright licence (P107) on every chublet item</text><text x="250" y="99" font-family="Fira Sans, sans-serif" font-size="15.5" fill="#1E1425" text-anchor="middle">taken over from CITATION.cff</text><path d="M250,117 L250,130" fill="none" stroke="#2A5F8A" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M250,139 L244.15,126 L255.85,126 z" fill="#2A5F8A"/><rect x="22" y="141" width="456" height="93" rx="10" fill="#EDF2F5" stroke="#2A5F8A" stroke-width="2.5"/><text x="250" y="170.3" font-family="Fira Sans, sans-serif" font-size="18" font-weight="700" fill="#1E1425" text-anchor="middle">Provenance</text><text x="250" y="196.5" font-family="Fira Sans, sans-serif" font-size="15.5" fill="#1E1425" text-anchor="middle">6440 of 6873 statements carry a reference</text><text x="250" y="218" font-family="Fira Sans, sans-serif" font-size="15.5" fill="#1E1425" text-anchor="middle">1352 carry a qualifier such as a date</text><path d="M250,236 L250,249" fill="none" stroke="#2A5F8A" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M250,258 L244.15,245 L255.85,245 z" fill="#2A5F8A"/><rect x="22" y="260" width="456" height="71.5" rx="10" fill="#DCE5EC" stroke="#2A5F8A" stroke-width="2.5"/><text x="250" y="289.3" font-family="Fira Sans, sans-serif" font-size="18" font-weight="700" fill="#1E1425" text-anchor="middle">Attribution</text><text x="250" y="315.5" font-family="Fira Sans, sans-serif" font-size="15.5" fill="#1E1425" text-anchor="middle">properties for copyright holder (P167) and year (P168)</text></g></g></g></svg>
