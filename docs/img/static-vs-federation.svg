<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="590" viewBox="0 0 1000 590"><metadata xmlns:dc="http://purl.org/dc/elements/1.1/"><dc:creator>Florian Thiery</dc:creator><dc:rights>CC BY 4.0 (https://creativecommons.org/licenses/by/4.0/)</dc:rights></metadata><style>@font-face { font-family: "Fira Sans"; src: url("../fonts/FiraSans-Regular.ttf"); font-weight: 400; } @font-face { font-family: "Fira Sans"; src: url("../fonts/FiraSans-Bold.ttf"); font-weight: 700; }</style><g transform="translate(10,10)"><rect x="230" y="0" width="520" height="104" rx="14" fill="#ffffff" stroke="#64748b" stroke-width="2"/><text x="490" y="36" font-family="Fira Sans, sans-serif" font-size="20" font-weight="700" fill="#1E1425" text-anchor="middle">The model as CSV tables</text><text x="490" y="62" font-family="Fira Sans, sans-serif" font-size="14.5" fill="#1E1425" text-anchor="middle">1007 entities: 13 classes, 168 properties, 826 items</text><text x="490" y="84" font-family="Fira Sans, sans-serif" font-size="13.5" fill="#5B5568" text-anchor="middle">6873 statements · repository chublets-wikibase-demo</text>
<path d="M490,106 L490,140 L215,140 L215,176" fill="none" stroke="#5B5568" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><path d="M215,188 L209.6,176 L220.4,176 z" fill="#5B5568"/>
<rect x="0" y="190" width="430" height="380" rx="14" fill="#F0F7F6" stroke="#0E7A6E" stroke-width="2.4"/><text x="24" y="232" font-family="Fira Sans, sans-serif" font-size="26" font-weight="700" fill="#0E7A6E" text-anchor="start">Static</text><text x="24" y="256" font-family="Fira Sans, sans-serif" font-size="13.5" fill="#5B5568" text-anchor="start">wikibase-static · read-only HTML pages</text><text x="24" y="292" font-family="Fira Sans, sans-serif" font-size="12.5" font-weight="700" fill="#5B5568" text-anchor="start">What it does</text><text x="24" y="312" font-family="Fira Sans, sans-serif" font-size="14.5" fill="#1E1425" text-anchor="start">reads the CSV tables and renders the model as web</text><text x="24" y="331" font-family="Fira Sans, sans-serif" font-size="14.5" fill="#1E1425" text-anchor="start">pages</text><text x="24" y="370" font-family="Fira Sans, sans-serif" font-size="12.5" font-weight="700" fill="#5B5568" text-anchor="start">Needs</text><text x="24" y="390" font-family="Fira Sans, sans-serif" font-size="14.5" fill="#1E1425" text-anchor="start">no server, no account and no write access to any</text><text x="24" y="409" font-family="Fira Sans, sans-serif" font-size="14.5" fill="#1E1425" text-anchor="start">Wikibase</text><text x="24" y="448" font-family="Fira Sans, sans-serif" font-size="12.5" font-weight="700" fill="#5B5568" text-anchor="start">Wikidata items</text><text x="24" y="468" font-family="Fira Sans, sans-serif" font-size="14.5" fill="#1E1425" text-anchor="start">shown as they are in the model, including stubs</text><text x="24" y="507" font-family="Fira Sans, sans-serif" font-size="12.5" font-weight="700" fill="#5B5568" text-anchor="start">Result</text><text x="24" y="527" font-family="Fira Sans, sans-serif" font-size="14.5" fill="#1E1425" text-anchor="start">pages that run on GitHub Pages</text>
<path d="M490,106 L490,140 L765,140 L765,176" fill="none" stroke="#5B5568" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><path d="M765,188 L759.6,176 L770.4,176 z" fill="#5B5568"/>
<rect x="550" y="190" width="430" height="380" rx="14" fill="#F3F1F4" stroke="#3B1F4A" stroke-width="2.4"/><text x="574" y="232" font-family="Fira Sans, sans-serif" font-size="26" font-weight="700" fill="#3B1F4A" text-anchor="start">Federation</text><text x="574" y="256" font-family="Fira Sans, sans-serif" font-size="13.5" fill="#5B5568" text-anchor="start">wikibase-federation · writes into a real Wikibase</text><text x="574" y="292" font-family="Fira Sans, sans-serif" font-size="12.5" font-weight="700" fill="#5B5568" text-anchor="start">What it does</text><text x="574" y="312" font-family="Fira Sans, sans-serif" font-size="14.5" fill="#1E1425" text-anchor="start">pushes the model into a Wikibase in three phases</text><text x="574" y="351" font-family="Fira Sans, sans-serif" font-size="12.5" font-weight="700" fill="#5B5568" text-anchor="start">Needs</text><text x="574" y="371" font-family="Fira Sans, sans-serif" font-size="14.5" fill="#1E1425" text-anchor="start">an account of the target Wikibase; a dry run is the default</text><text x="574" y="410" font-family="Fira Sans, sans-serif" font-size="12.5" font-weight="700" fill="#5B5568" text-anchor="start">Wikidata items</text><text x="574" y="430" font-family="Fira Sans, sans-serif" font-size="14.5" fill="#1E1425" text-anchor="start">become federated values; stubs are not created</text><text x="574" y="469" font-family="Fira Sans, sans-serif" font-size="12.5" font-weight="700" fill="#5B5568" text-anchor="start">Result</text><text x="574" y="489" font-family="Fira Sans, sans-serif" font-size="14.5" fill="#1E1425" text-anchor="start">a live Wikibase; the new ids are recorded in an id map</text></g></svg>
