<svg xmlns="http://www.w3.org/2000/svg" width="1570" height="394" viewBox="0 0 1570 394">
<style>@font-face { font-family: "Fira Sans"; src: url("../../fonts/FiraSans-Regular.ttf"); font-weight: 400; } @font-face { font-family: "Fira Sans"; src: url("../../fonts/FiraSans-Bold.ttf"); font-weight: 700; }</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0E7A6E"/></marker>
</defs>
<text x="60" y="70" text-anchor="start" font-family="Fira Sans" font-weight="700" font-size="28" fill="#1E1425">The OpenRefine route (out/OpenRefine/)</text>
<rect x="60" y="120" width="250" height="170" rx="10" fill="#EBF4F3" stroke="#0E7A6E" stroke-width="3"/><text x="185.0" y="168.0" text-anchor="middle" font-family="Fira Sans" font-weight="700" font-size="21" fill="#1E1425">Setup</text><text x="185.0" y="198.0" text-anchor="middle" font-family="Fira Sans" font-weight="400" font-size="13.5" fill="#1E1425">OpenRefine 3.7+, Wikibase</text><text x="185.0" y="228.0" text-anchor="middle" font-family="Fira Sans" font-weight="400" font-size="13.5" fill="#1E1425">extension, log in with the</text><text x="185.0" y="258.0" text-anchor="middle" font-family="Fira Sans" font-weight="400" font-size="13.5" fill="#1E1425">editing account</text>
<line x1="310" y1="205.0" x2="354" y2="205.0" stroke="#0E7A6E" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="360" y="120" width="250" height="170" rx="10" fill="#EBF4F3" stroke="#0E7A6E" stroke-width="3"/><text x="485.0" y="153.0" text-anchor="middle" font-family="Fira Sans" font-weight="700" font-size="21" fill="#1E1425">Split &amp; derive</text><text x="485.0" y="183.0" text-anchor="middle" font-family="Fira Sans" font-weight="400" font-size="13.5" fill="#1E1425">Multi-valued cells; VCS,</text><text x="485.0" y="213.0" text-anchor="middle" font-family="Fira Sans" font-weight="400" font-size="13.5" fill="#1E1425">archive date, CRAN/PyPI</text><text x="485.0" y="243.0" text-anchor="middle" font-family="Fira Sans" font-weight="400" font-size="13.5" fill="#1E1425">pulled from GREL</text><text x="485.0" y="273.0" text-anchor="middle" font-family="Fira Sans" font-weight="400" font-size="13.5" fill="#1E1425">expressions</text>
<line x1="610" y1="205.0" x2="654" y2="205.0" stroke="#0E7A6E" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="660" y="120" width="250" height="170" rx="10" fill="#EBF4F3" stroke="#0E7A6E" stroke-width="3"/><text x="785.0" y="153.0" text-anchor="middle" font-family="Fira Sans" font-weight="700" font-size="21" fill="#1E1425">Reconcile</text><text x="785.0" y="183.0" text-anchor="middle" font-family="Fira Sans" font-weight="400" font-size="13.5" fill="#1E1425">name + repository match</text><text x="785.0" y="213.0" text-anchor="middle" font-family="Fira Sans" font-weight="400" font-size="13.5" fill="#1E1425">against P1324; owns the</text><text x="785.0" y="243.0" text-anchor="middle" font-family="Fira Sans" font-weight="400" font-size="13.5" fill="#1E1425">shared vocabulary</text><text x="785.0" y="273.0" text-anchor="middle" font-family="Fira Sans" font-weight="400" font-size="13.5" fill="#1E1425">(P277/P1547/P921)</text>
<line x1="910" y1="205.0" x2="954" y2="205.0" stroke="#0E7A6E" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="960" y="120" width="250" height="170" rx="10" fill="#EBF4F3" stroke="#0E7A6E" stroke-width="3"/><text x="1085.0" y="168.0" text-anchor="middle" font-family="Fira Sans" font-weight="700" font-size="21" fill="#1E1425">Schema &amp; upload</text><text x="1085.0" y="198.0" text-anchor="middle" font-family="Fira Sans" font-weight="400" font-size="13.5" fill="#1E1425">Edit Wikidata schema;</text><text x="1085.0" y="228.0" text-anchor="middle" font-family="Fira Sans" font-weight="400" font-size="13.5" fill="#1E1425">direct upload or export as</text><text x="1085.0" y="258.0" text-anchor="middle" font-family="Fira Sans" font-weight="400" font-size="13.5" fill="#1E1425">QuickStatements</text>
<line x1="1210" y1="205.0" x2="1254" y2="205.0" stroke="#0E7A6E" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="1260" y="120" width="250" height="170" rx="10" fill="#EBF4F3" stroke="#0E7A6E" stroke-width="3"/><text x="1385.0" y="168.0" text-anchor="middle" font-family="Fira Sans" font-weight="700" font-size="21" fill="#1E1425">Hand back</text><text x="1385.0" y="198.0" text-anchor="middle" font-family="Fira Sans" font-weight="400" font-size="13.5" fill="#1E1425">id,qid CSV → concordance;</text><text x="1385.0" y="228.0" text-anchor="middle" font-family="Fira Sans" font-weight="400" font-size="13.5" fill="#1E1425">resolved values →</text><text x="1385.0" y="258.0" text-anchor="middle" font-family="Fira Sans" font-weight="400" font-size="13.5" fill="#1E1425">vocabulary.json</text>
<text x="60" y="324" text-anchor="start" font-family="Fira Sans" font-weight="400" font-size="15" fill="#5B5568">Two obligatory statements on every item either route writes: P31 instance of + P6104 maintained by WikiProject.</text>
</svg>