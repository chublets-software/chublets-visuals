<svg xmlns="http://www.w3.org/2000/svg" width="1554" height="175" viewBox="0 0 1554 175"><metadata xmlns:dc="http://purl.org/dc/elements/1.1/"><dc:creator>Florian Thiery</dc:creator><dc:rights>CC BY 4.0 (https://creativecommons.org/licenses/by/4.0/)</dc:rights></metadata><style>@font-face { font-family: "Fira Sans"; src: url("../fonts/FiraSans-Regular.ttf"); font-weight: 400; } @font-face { font-family: "Fira Sans"; src: url("../fonts/FiraSans-Bold.ttf"); font-weight: 700; }</style><g transform="translate(10,10)"><rect x="0" y="0" width="270" height="114.5" rx="10" fill="#EBE8EC" stroke="#3B1F4A" stroke-width="2.5"/><text x="135" y="29.3" font-family="Fira Sans, sans-serif" font-size="18" font-weight="700" fill="#1E1425" text-anchor="middle">check</text><text x="135" y="55.5" font-family="Fira Sans, sans-serif" font-size="15.5" fill="#1E1425" text-anchor="middle">default step</text><text x="135" y="77" font-family="Fira Sans, sans-serif" font-size="15.5" fill="#1E1425" text-anchor="middle">verifies Q-IDs, datatypes and</text><text x="135" y="98.5" font-family="Fira Sans, sans-serif" font-size="15.5" fill="#1E1425" text-anchor="middle">duplicate claims; writes nothing</text>
<path d="M273,57.25 L304,57.25" fill="none" stroke="#3B1F4A" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M313,57.25 L300,63.1 L300,51.4 z" fill="#3B1F4A"/>
<rect x="316" y="0" width="270" height="114.5" rx="10" fill="#EBE8EC" stroke="#3B1F4A" stroke-width="2.5"/><text x="451" y="29.3" font-family="Fira Sans, sans-serif" font-size="18" font-weight="700" fill="#1E1425" text-anchor="middle">preview</text><text x="451" y="55.5" font-family="Fira Sans, sans-serif" font-size="15.5" fill="#1E1425" text-anchor="middle">docs/preview.html</text><text x="451" y="77" font-family="Fira Sans, sans-serif" font-size="15.5" fill="#1E1425" text-anchor="middle">every item's statements, blocked,</text><text x="451" y="98.5" font-family="Fira Sans, sans-serif" font-size="15.5" fill="#1E1425" text-anchor="middle">deferred or noted</text>
<path d="M589,57.25 L620,57.25" fill="none" stroke="#3B1F4A" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M629,57.25 L616,63.1 L616,51.4 z" fill="#3B1F4A"/>
<rect x="632" y="0" width="270" height="114.5" rx="10" fill="#EBE8EC" stroke="#3B1F4A" stroke-width="2.5"/><text x="767" y="29.3" font-family="Fira Sans, sans-serif" font-size="18" font-weight="700" fill="#1E1425" text-anchor="middle">reconcile</text><text x="767" y="55.5" font-family="Fira Sans, sans-serif" font-size="15.5" fill="#1E1425" text-anchor="middle">read-only, slow</text><text x="767" y="77" font-family="Fira Sans, sans-serif" font-size="15.5" fill="#1E1425" text-anchor="middle">what Wikidata already has, by</text><text x="767" y="98.5" font-family="Fira Sans, sans-serif" font-size="15.5" fill="#1E1425" text-anchor="middle">repository URL, DOI, CRAN, PyPI</text>
<path d="M905,57.25 L936,57.25" fill="none" stroke="#3B1F4A" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M945,57.25 L932,63.1 L932,51.4 z" fill="#3B1F4A"/>
<rect x="948" y="0" width="270" height="114.5" rx="10" fill="#EBE8EC" stroke="#3B1F4A" stroke-width="2.5"/><text x="1083" y="29.3" font-family="Fira Sans, sans-serif" font-size="18" font-weight="700" fill="#1E1425" text-anchor="middle">push</text><text x="1083" y="55.5" font-family="Fira Sans, sans-serif" font-size="15.5" fill="#1E1425" text-anchor="middle">dry run by default</text><text x="1083" y="77" font-family="Fira Sans, sans-serif" font-size="15.5" fill="#1E1425" text-anchor="middle">a text report of what would be</text><text x="1083" y="98.5" font-family="Fira Sans, sans-serif" font-size="15.5" fill="#1E1425" text-anchor="middle">written</text>
<path d="M1221,57.25 L1252,57.25" fill="none" stroke="#3B1F4A" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M1261,57.25 L1248,63.1 L1248,51.4 z" fill="#3B1F4A"/>
<rect x="1264" y="0" width="270" height="114.5" rx="10" fill="#EBE8EC" stroke="#3B1F4A" stroke-width="2.5"/><text x="1399" y="29.3" font-family="Fira Sans, sans-serif" font-size="18" font-weight="700" fill="#1E1425" text-anchor="middle">push --live</text><text x="1399" y="55.5" font-family="Fira Sans, sans-serif" font-size="15.5" fill="#1E1425" text-anchor="middle">the only step that writes</text><text x="1399" y="77" font-family="Fira Sans, sans-serif" font-size="15.5" fill="#1E1425" text-anchor="middle">only rows that reconcile matched</text><text x="1399" y="98.5" font-family="Fira Sans, sans-serif" font-size="15.5" fill="#1E1425" text-anchor="middle">to a Q-ID; never creates items</text>
<text x="0" y="151" font-family="Fira Sans, sans-serif" font-size="14.5" font-style="italic" fill="#5B5568" text-anchor="start">Also available: vocab, categories and subjects. They build the worksheets of the shared vocabulary and are not part of this session.</text></g></svg>
