<rect x="632" y="0" width="270" height="114.5" rx="10" fill="#E6F1F0" stroke="#0E7A6E" stroke-width="2.5"/><text x="767" y="29.3" font-family="Fira Sans, sans-serif" font-size="18" font-weight="700" fill="#1E1425" text-anchor="middle">Reconcile</text><text x="767" y="55.5" font-family="Fira Sans, sans-serif" font-size="15.5" fill="#1E1425" text-anchor="middle">name and repository match</text><text x="767" y="77" font-family="Fira Sans, sans-serif" font-size="15.5" fill="#1E1425" text-anchor="middle">against P1324; owns the shared</text><text x="767" y="98.5" font-family="Fira Sans, sans-serif" font-size="15.5" fill="#1E1425" text-anchor="middle">vocabulary (P277, P1547, P921)</text>
