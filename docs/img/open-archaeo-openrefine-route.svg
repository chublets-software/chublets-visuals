<svg xmlns="http://www.w3.org/2000/svg" width="1554" height="134.5" viewBox="0 0 1554 134.5"><metadata xmlns:dc="http://purl.org/dc/elements/1.1/"><dc:creator>Florian Thiery</dc:creator><dc:rights>CC BY 4.0 (https://creativecommons.org/licenses/by/4.0/)</dc:rights></metadata><style>@font-face { font-family: "Fira Sans"; src: url("../fonts/FiraSans-Regular.ttf"); font-weight: 400; } @font-face { font-family: "Fira Sans"; src: url("../fonts/FiraSans-Bold.ttf"); font-weight: 700; }</style><g transform="translate(10,10)"><rect x="0" y="0" width="270" height="114.5" rx="10" fill="#E6F1F0" stroke="#0E7A6E" stroke-width="2.5"/><text x="135" y="29.3" font-family="Fira Sans, sans-serif" font-size="18" font-weight="700" fill="#1E1425" text-anchor="middle">Setup</text><text x="135" y="55.5" font-family="Fira Sans, sans-serif" font-size="15.5" fill="#1E1425" text-anchor="middle">OpenRefine 3.7 or later, the</text><text x="135" y="77" font-family="Fira Sans, sans-serif" font-size="15.5" fill="#1E1425" text-anchor="middle">Wikibase extension, logged in with</text><text x="135" y="98.5" font-family="Fira Sans, sans-serif" font-size="15.5" fill="#1E1425" text-anchor="middle">the editing account</text>
<path d="M273,57.25 L304,57.25" fill="none" stroke="#0E7A6E" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M313,57.25 L300,63.1 L300,51.4 z" fill="#0E7A6E"/>
