<rect x="948" y="0" width="270" height="114.5" rx="10" fill="#E6F1F0" stroke="#0E7A6E" stroke-width="2.5"/><text x="1083" y="29.3" font-family="Fira Sans, sans-serif" font-size="18" font-weight="700" fill="#1E1425" text-anchor="middle">Schema and upload</text><text x="1083" y="55.5" font-family="Fira Sans, sans-serif" font-size="15.5" fill="#1E1425" text-anchor="middle">edit the Wikidata schema; upload</text><text x="1083" y="77" font-family="Fira Sans, sans-serif" font-size="15.5" fill="#1E1425" text-anchor="middle">directly or export as</text><text x="1083" y="98.5" font-family="Fira Sans, sans-serif" font-size="15.5" fill="#1E1425" text-anchor="middle">QuickStatements</text>
