<svg xmlns="http://www.w3.org/2000/svg" width="1570" height="384" viewBox="0 0 1570 384">
<style>@font-face { font-family: "Fira Sans"; src: url("../../fonts/FiraSans-Regular.ttf"); font-weight: 400; } @font-face { font-family: "Fira Sans"; src: url("../../fonts/FiraSans-Bold.ttf"); font-weight: 700; }</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3B1F4A"/></marker>
</defs>
<text x="60" y="70" text-anchor="start" font-family="Fira Sans" font-weight="700" font-size="28" fill="#1E1425">The Python route (py/wikidata/main.py)</text>
<rect x="60" y="120" width="250" height="160" rx="10" fill="#EFEDF0" stroke="#3B1F4A" stroke-width="3"/><text x="185.0" y="148.0" text-anchor="middle" font-family="Fira Sans" font-weight="700" font-size="20" fill="#1E1425">check</text><text x="185.0" y="178.0" text-anchor="middle" font-family="Fira Sans" font-weight="400" font-size="13.5" fill="#1E1425">default step</text><text x="185.0" y="208.0" text-anchor="middle" font-family="Fira Sans" font-weight="400" font-size="13" fill="#1E1425">Verifies Q-ids, datatypes,</text><text x="185.0" y="238.0" text-anchor="middle" font-family="Fira Sans" font-weight="400" font-size="13" fill="#1E1425">no duplicate claims --</text><text x="185.0" y="268.0" text-anchor="middle" font-family="Fira Sans" font-weight="400" font-size="13" fill="#1E1425">writes nothing</text>
<line x1="310" y1="200.0" x2="354" y2="200.0" stroke="#3B1F4A" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="360" y="120" width="250" height="160" rx="10" fill="#EFEDF0" stroke="#3B1F4A" stroke-width="3"/><text x="485.0" y="163.0" text-anchor="middle" font-family="Fira Sans" font-weight="700" font-size="20" fill="#1E1425">preview</text><text x="485.0" y="193.0" text-anchor="middle" font-family="Fira Sans" font-weight="400" font-size="13.5" fill="#1E1425">docs/preview.html</text><text x="485.0" y="223.0" text-anchor="middle" font-family="Fira Sans" font-weight="400" font-size="13" fill="#1E1425">Every item's statements,</text><text x="485.0" y="253.0" text-anchor="middle" font-family="Fira Sans" font-weight="400" font-size="13" fill="#1E1425">blocked / deferred / note</text>
<line x1="610" y1="200.0" x2="654" y2="200.0" stroke="#3B1F4A" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="660" y="120" width="250" height="160" rx="10" fill="#EFEDF0" stroke="#3B1F4A" stroke-width="3"/><text x="785.0" y="148.0" text-anchor="middle" font-family="Fira Sans" font-weight="700" font-size="20" fill="#1E1425">reconcile</text><text x="785.0" y="178.0" text-anchor="middle" font-family="Fira Sans" font-weight="400" font-size="13.5" fill="#1E1425">read-only, slow</text><text x="785.0" y="208.0" text-anchor="middle" font-family="Fira Sans" font-weight="400" font-size="13" fill="#1E1425">What Wikidata already has</text><text x="785.0" y="238.0" text-anchor="middle" font-family="Fira Sans" font-weight="400" font-size="13" fill="#1E1425">-- by repository URL, DOI,</text><text x="785.0" y="268.0" text-anchor="middle" font-family="Fira Sans" font-weight="400" font-size="13" fill="#1E1425">CRAN, PyPI</text>
<line x1="910" y1="200.0" x2="954" y2="200.0" stroke="#3B1F4A" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="960" y="120" width="250" height="160" rx="10" fill="#EFEDF0" stroke="#3B1F4A" stroke-width="3"/><text x="1085.0" y="163.0" text-anchor="middle" font-family="Fira Sans" font-weight="700" font-size="20" fill="#1E1425">push</text><text x="1085.0" y="193.0" text-anchor="middle" font-family="Fira Sans" font-weight="400" font-size="13.5" fill="#1E1425">dry run by default</text><text x="1085.0" y="223.0" text-anchor="middle" font-family="Fira Sans" font-weight="400" font-size="13" fill="#1E1425">Text report of what would</text><text x="1085.0" y="253.0" text-anchor="middle" font-family="Fira Sans" font-weight="400" font-size="13" fill="#1E1425">be written</text>
<line x1="1210" y1="200.0" x2="1254" y2="200.0" stroke="#3B1F4A" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="1260" y="120" width="250" height="160" rx="10" fill="#EFEDF0" stroke="#3B1F4A" stroke-width="3"/><text x="1385.0" y="148.0" text-anchor="middle" font-family="Fira Sans" font-weight="700" font-size="20" fill="#1E1425">push --live</text><text x="1385.0" y="178.0" text-anchor="middle" font-family="Fira Sans" font-weight="400" font-size="13.5" fill="#1E1425">the only write</text><text x="1385.0" y="208.0" text-anchor="middle" font-family="Fira Sans" font-weight="400" font-size="13" fill="#1E1425">Only rows reconcile matched</text><text x="1385.0" y="238.0" text-anchor="middle" font-family="Fira Sans" font-weight="400" font-size="13" fill="#1E1425">to a Q-id -- never creates</text><text x="1385.0" y="268.0" text-anchor="middle" font-family="Fira Sans" font-weight="400" font-size="13" fill="#1E1425">items</text>
<text x="60" y="314" text-anchor="start" font-family="Fira Sans" font-weight="400" font-size="15" fill="#5B5568">Also available: vocab, categories, subjects -- worksheet builders that feed the shared vocabulary, not part of this session.</text>
</svg>