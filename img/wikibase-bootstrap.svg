<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="564" viewBox="0 0 1360 564"><metadata xmlns:dc="http://purl.org/dc/elements/1.1/"><dc:creator>Florian Thiery</dc:creator><dc:rights>CC BY 4.0 (https://creativecommons.org/licenses/by/4.0/)</dc:rights></metadata><style>@font-face { font-family: "Fira Sans"; src: url("../fonts/FiraSans-Regular.ttf"); font-weight: 400; } @font-face { font-family: "Fira Sans"; src: url("../fonts/FiraSans-Bold.ttf"); font-weight: 700; }</style><g transform="translate(10,10)"><rect x="0" y="0" width="400" height="250" rx="14" fill="#ffffff" stroke="#64748b" stroke-width="2"/><text x="22" y="44" font-family="Fira Sans, sans-serif" font-size="24" font-weight="700" fill="#1E1425" text-anchor="start">1  core</text><text x="22" y="70" font-family="Fira Sans, sans-serif" font-size="13.5" fill="#5B5568" text-anchor="start">ids equal those of the model</text><rect x="22" y="106" width="28" height="22" rx="6" fill="#9a3412"/><text x="62" y="123" font-family="Fira Sans, sans-serif" font-size="15" fill="#1E1425" text-anchor="start">3 built-in classes (Q1–Q3)</text><rect x="22" y="142" width="28" height="22" rx="6" fill="#fbbf24" stroke="#b45309" stroke-width="1.4"/><text x="62" y="159" font-family="Fira Sans, sans-serif" font-size="15" fill="#1E1425" text-anchor="start">10 built-in properties (P1–P10)</text>
<path d="M408,125 L456,125" fill="none" stroke="#5B5568" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><path d="M464,125 L451,130.85 L451,119.15 z" fill="#5B5568"/>
<rect x="470" y="0" width="400" height="250" rx="14" fill="#ffffff" stroke="#64748b" stroke-width="2"/><text x="492" y="44" font-family="Fira Sans, sans-serif" font-size="24" font-weight="700" fill="#1E1425" text-anchor="start">2  model</text><text x="492" y="70" font-family="Fira Sans, sans-serif" font-size="13.5" fill="#5B5568" text-anchor="start">new ids, recorded in the id map</text><rect x="492" y="106" width="28" height="22" rx="6" fill="#9a3412"/><text x="532" y="123" font-family="Fira Sans, sans-serif" font-size="15" fill="#1E1425" text-anchor="start">7 classes defined for chublets</text><rect x="492" y="142" width="28" height="22" rx="6" fill="#fbbf24" stroke="#b45309" stroke-width="1.4"/><text x="532" y="159" font-family="Fira Sans, sans-serif" font-size="15" fill="#1E1425" text-anchor="start">158 properties</text>
<path d="M878,125 L926,125" fill="none" stroke="#5B5568" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><path d="M934,125 L921,130.85 L921,119.15 z" fill="#5B5568"/>
<rect x="940" y="0" width="400" height="250" rx="14" fill="#ffffff" stroke="#64748b" stroke-width="2"/><text x="962" y="44" font-family="Fira Sans, sans-serif" font-size="24" font-weight="700" fill="#1E1425" text-anchor="start">3  items</text><text x="962" y="70" font-family="Fira Sans, sans-serif" font-size="13.5" fill="#5B5568" text-anchor="start">new ids, in steps (by origin, with a limit)</text><rect x="962" y="106" width="28" height="22" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.4"/><text x="1002" y="123" font-family="Fira Sans, sans-serif" font-size="15" fill="#1E1425" text-anchor="start">803 items from open-archaeo</text><rect x="962" y="142" width="28" height="22" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.4"/><text x="1002" y="159" font-family="Fira Sans, sans-serif" font-size="15" fill="#1E1425" text-anchor="start">6 items taken over from Wikidata</text><text x="962" y="190" font-family="Fira Sans, sans-serif" font-size="13" font-style="italic" fill="#5B5568" text-anchor="start">not written: 17 stubs of Wikidata items</text>
<text x="0" y="300" font-family="Fira Sans, sans-serif" font-size="15" font-weight="700" fill="#1E1425" text-anchor="start">Rules of the push</text><rect x="0" y="316" width="8" height="8" rx="4" fill="#64748b"/><text x="20" y="328" font-family="Fira Sans, sans-serif" font-size="14.5" fill="#1E1425" text-anchor="start">every property is a local property (no federated properties)</text><rect x="0" y="342" width="8" height="8" rx="4" fill="#64748b"/><text x="20" y="354" font-family="Fira Sans, sans-serif" font-size="14.5" fill="#1E1425" text-anchor="start">item values may point to Wikidata items (federated values)</text><rect x="0" y="368" width="8" height="8" rx="4" fill="#64748b"/><text x="20" y="380" font-family="Fira Sans, sans-serif" font-size="14.5" fill="#1E1425" text-anchor="start">stubs of Wikidata items are not created; the value points to Wikidata</text><rect x="0" y="394" width="8" height="8" rx="4" fill="#64748b"/><text x="20" y="406" font-family="Fira Sans, sans-serif" font-size="14.5" fill="#1E1425" text-anchor="start">dry run is the default; writing needs an explicit switch</text><rect x="0" y="420" width="8" height="8" rx="4" fill="#64748b"/><text x="20" y="432" font-family="Fira Sans, sans-serif" font-size="14.5" fill="#1E1425" text-anchor="start">a rerun continues where the last run stopped (ids are recorded)</text>
<text x="700" y="300" font-family="Fira Sans, sans-serif" font-size="15" font-weight="700" fill="#1E1425" text-anchor="start">A target that is not empty</text><rect x="700" y="320" width="150" height="40" rx="10" fill="#E7EAED" stroke="#64748b" stroke-width="1.6"/><text x="775" y="346" font-family="Fira Sans, sans-serif" font-size="15" font-weight="700" fill="#1E1425" text-anchor="middle">inventory</text><text x="870" y="338" font-family="Fira Sans, sans-serif" font-size="13.5" fill="#1E1425" text-anchor="start">read-only list of what the target already holds</text><path d="M775,362 L775,376" fill="none" stroke="#5B5568" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M775,384 L770.5,374 L779.5,374 z" fill="#5B5568"/><rect x="700" y="390" width="150" height="40" rx="10" fill="#E7EAED" stroke="#64748b" stroke-width="1.6"/><text x="775" y="416" font-family="Fira Sans, sans-serif" font-size="15" font-weight="700" fill="#1E1425" text-anchor="middle">adopt list</text><text x="870" y="399" font-family="Fira Sans, sans-serif" font-size="13.5" fill="#1E1425" text-anchor="start">93 pairs: id in the model → existing id in the target; checked by label and</text><text x="870" y="417" font-family="Fira Sans, sans-serif" font-size="13.5" fill="#1E1425" text-anchor="start">datatype</text><path d="M775,432 L775,446" fill="none" stroke="#5B5568" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M775,454 L770.5,444 L779.5,444 z" fill="#5B5568"/><rect x="700" y="460" width="150" height="40" rx="10" fill="#E7EAED" stroke="#64748b" stroke-width="1.6"/><text x="775" y="486" font-family="Fira Sans, sans-serif" font-size="15" font-weight="700" fill="#1E1425" text-anchor="middle">run</text><text x="870" y="478" font-family="Fira Sans, sans-serif" font-size="13.5" fill="#1E1425" text-anchor="start">adopted entities are not created again; their statements are added</text><text x="700" y="536" font-family="Fira Sans, sans-serif" font-size="13.5" font-style="italic" fill="#5B5568" text-anchor="start">The id map of the push lists 980 entities of the target.</text></g></svg>
