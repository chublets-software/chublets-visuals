<rect x="60" y="70" width="380" height="180" rx="10" fill="#E6F1F0" stroke="#0E7A6E" stroke-width="3.5"/><text x="250.0" y="112" text-anchor="middle" font-family="Fira Sans" font-weight="700" font-size="23" fill="#1E1425">Wikidata items</text><text x="250.0" y="150" text-anchor="middle" font-family="Fira Sans" font-weight="400" font-size="16.5" fill="#1E1425">chublets bridge items from the</text><text x="250.0" y="174" text-anchor="middle" font-family="Fira Sans" font-weight="400" font-size="16.5" fill="#1E1425">open-archaeo → Wikidata pipeline</text>
