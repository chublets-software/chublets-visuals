<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="610" viewBox="0 0 1400 610"><metadata xmlns:dc="http://purl.org/dc/elements/1.1/"><dc:creator>Florian Thiery</dc:creator><dc:rights>CC BY 4.0 (https://creativecommons.org/licenses/by/4.0/)</dc:rights></metadata><style>@font-face { font-family: "Fira Sans"; src: url("../fonts/FiraSans-Regular.ttf"); font-weight: 400; } @font-face { font-family: "Fira Sans"; src: url("../fonts/FiraSans-Bold.ttf"); font-weight: 700; }</style><g transform="translate(10,10)"><rect x="0" y="0" width="640" height="190" rx="12" fill="#EDF2F5" stroke="#2A5F8A" stroke-width="3"/><text x="320" y="40" font-family="Fira Sans, sans-serif" font-size="23" font-weight="700" fill="#1E1425" text-anchor="middle">Wikidata properties</text><text x="320" y="74" font-family="Fira Sans, sans-serif" font-size="16" fill="#1E1425" text-anchor="middle">software properties of the WikiProject</text><text x="320" y="98" font-family="Fira Sans, sans-serif" font-size="16" fill="#1E1425" text-anchor="middle">and further properties used for software</text><text x="320" y="168" font-family="Fira Sans, sans-serif" font-size="21" font-weight="700" fill="#2A5F8A" text-anchor="middle">114 properties with an equivalent in Wikidata (P4)</text>
<rect x="740" y="0" width="640" height="190" rx="12" fill="#EBF4F3" stroke="#0E7A6E" stroke-width="3"/><text x="1060" y="40" font-family="Fira Sans, sans-serif" font-size="23" font-weight="700" fill="#1E1425" text-anchor="middle">CodeMeta terms</text><text x="1060" y="74" font-family="Fira Sans, sans-serif" font-size="16" fill="#1E1425" text-anchor="middle">the CodeMeta vocabulary for software metadata</text><text x="1060" y="98" font-family="Fira Sans, sans-serif" font-size="16" fill="#1E1425" text-anchor="middle">mapped to Wikidata in the crosswalk</text><text x="1060" y="168" font-family="Fira Sans, sans-serif" font-size="21" font-weight="700" fill="#0E7A6E" text-anchor="middle">83 terms, 37 with a Wikidata property</text>
<path d="M320,196 L458.35,288.23" fill="none" stroke="#5B5568" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M470,296 L450.53,292.76 L459.52,279.28 z" fill="#5B5568"/>
<path d="M1060,196 L921.65,288.23" fill="none" stroke="#5B5568" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M910,296 L920.48,279.28 L929.47,292.76 z" fill="#5B5568"/>
<rect x="0" y="300" width="1380" height="290" rx="14" fill="#EBE8EC" stroke="#3B1F4A" stroke-width="3.5"/><text x="690" y="346" font-family="Fira Sans, sans-serif" font-size="26" font-weight="700" fill="#1E1425" text-anchor="middle">Wikibase of chublets: 168 properties</text><text x="690" y="376" font-family="Fira Sans, sans-serif" font-size="15.5" fill="#1E1425" text-anchor="middle">all of them local properties; each states its equivalents (Wikidata P4, CodeMeta P101, schema.org P102)</text><rect x="40" y="410" width="283.31" height="44" rx="6" fill="#3B1F4A"/><text x="181.65" y="440" font-family="Fira Sans, sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">37</text><text x="181.65" y="480" font-family="Fira Sans, sans-serif" font-size="14" fill="#1E1425" text-anchor="middle">crosswalked</text><rect x="326.31" y="410" width="352.95" height="44" rx="6" fill="#0E7A6E"/><text x="502.79" y="440" font-family="Fira Sans, sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">46</text><text x="502.79" y="480" font-family="Fira Sans, sans-serif" font-size="14" fill="#1E1425" text-anchor="middle">CodeMeta only</text><rect x="682.26" y="410" width="399.38" height="44" rx="6" fill="#2A5F8A"/><text x="881.95" y="440" font-family="Fira Sans, sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">52</text><text x="881.95" y="480" font-family="Fira Sans, sans-serif" font-size="14" fill="#1E1425" text-anchor="middle">Wikidata only</text><rect x="1084.64" y="410" width="136.29" height="44" rx="6" fill="#B8862E"/><text x="1152.79" y="440" font-family="Fira Sans, sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">18</text><text x="1152.79" y="480" font-family="Fira Sans, sans-serif" font-size="14" fill="#1E1425" text-anchor="middle">chublets addition</text><rect x="1223.93" y="410" width="113.07" height="44" rx="6" fill="#5B5568"/><text x="1280.46" y="440" font-family="Fira Sans, sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">15</text><text x="1280.46" y="480" font-family="Fira Sans, sans-serif" font-size="14" fill="#1E1425" text-anchor="middle">built-in and</text><text x="1280.46" y="498" font-family="Fira Sans, sans-serif" font-size="14" fill="#1E1425" text-anchor="middle">later added</text><text x="690" y="564" font-family="Fira Sans, sans-serif" font-size="14.5" font-style="italic" fill="#5B5568" text-anchor="middle">The model is not invented from scratch: it starts from the crosswalk between the two vocabularies.</text></g></svg>
