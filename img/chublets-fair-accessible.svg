<svg xmlns="http://www.w3.org/2000/svg" width="520" height="396.5" viewBox="0 0 520 396.5"><metadata xmlns:dc="http://purl.org/dc/elements/1.1/"><dc:creator>Florian Thiery</dc:creator><dc:rights>CC BY 4.0 (https://creativecommons.org/licenses/by/4.0/)</dc:rights></metadata><style>@font-face { font-family: "Fira Sans"; src: url("../fonts/FiraSans-Regular.ttf"); font-weight: 400; } @font-face { font-family: "Fira Sans"; src: url("../fonts/FiraSans-Bold.ttf"); font-weight: 700; }</style><g transform="translate(10,10)"><rect x="0" y="0" width="500" height="376.5" rx="14" fill="#F7F6F7" stroke="#3B1F4A" stroke-width="3"/><path d="M0,66 L0,14 Q0,0 14,0 L486,0 Q500,0 500,14 L500,66 z" fill="#3B1F4A"/><rect x="18" y="15" width="36" height="36" rx="9" fill="#ffffff"/><text x="36" y="41" font-family="Fira Sans, sans-serif" font-size="24" font-weight="700" fill="#3B1F4A" text-anchor="middle">A</text><text x="70" y="42" font-family="Fira Sans, sans-serif" font-size="25" font-weight="700" fill="#ffffff" text-anchor="start">Accessible</text><g transform="translate(0,66)"><rect x="22" y="22" width="456" height="71.5" rx="10" fill="#EFEDF0" stroke="#3B1F4A" stroke-width="2.5"/><text x="250" y="51.3" font-family="Fira Sans, sans-serif" font-size="18" font-weight="700" fill="#1E1425" text-anchor="middle">Wikibase API and SPARQL endpoint</text><text x="250" y="77.5" font-family="Fira Sans, sans-serif" font-size="15.5" fill="#1E1425" text-anchor="middle">open protocols, the same for every client</text><path d="M250,95.5 L250,108.5" fill="none" stroke="#3B1F4A" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M250,117.5 L244.15,104.5 L255.85,104.5 z" fill="#3B1F4A"/><rect x="22" y="119.5" width="456" height="71.5" rx="10" fill="#EFEDF0" stroke="#3B1F4A" stroke-width="2.5"/><text x="250" y="148.8" font-family="Fira Sans, sans-serif" font-size="18" font-weight="700" fill="#1E1425" text-anchor="middle">No login for reading</text><text x="250" y="175" font-family="Fira Sans, sans-serif" font-size="15.5" fill="#1E1425" text-anchor="middle">a login only gates writing</text><path d="M250,193 L250,206" fill="none" stroke="#3B1F4A" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M250,215 L244.15,202 L255.85,202 z" fill="#3B1F4A"/><rect x="22" y="217" width="456" height="71.5" rx="10" fill="#DFDBE2" stroke="#3B1F4A" stroke-width="2.5"/><text x="250" y="246.3" font-family="Fira Sans, sans-serif" font-size="18" font-weight="700" fill="#1E1425" text-anchor="middle">Static pages as well</text><text x="250" y="272.5" font-family="Fira Sans, sans-serif" font-size="15.5" fill="#1E1425" text-anchor="middle">the same CSV model is published as static pages</text></g></g></svg>
