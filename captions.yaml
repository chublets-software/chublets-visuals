# Captions for the graphics of chublets-visuals.
#
# One entry per graphic, keyed by the file stem (img/<stem>.svg). The graphics
# themselves carry no title, header, footer or citation; everything a paper or
# slide needs next to a graphic is here. See py/captions.py for the rules.
#
#   <stem>:
#     caption: English (British); {placeholders} are filled from the facts the
#              step passes to captions.render(), so numbers cannot drift
#     alt:     alternative text, one or two sentences
#     sources: [optional list of source repositories / tables]
#     licence: optional; without it the default of py/captions.py applies
#              (CC BY 4.0 for graphics and tables, MIT for the code; see
#              LICENSE-GRAPHICS.md)
#
# Entries are added with the graphic they belong to (S10, S11).

class-tree:
  caption: >-
    Class tree of the chublets Wikibase: {n_classes} classes below the root class Instance (Q3).
    Class (Q1) and Property (Q2) are among the {n_kernel_classes} built-in classes of the data model,
    {n_pack_classes} classes were defined for chublets, and {n_stub_classes} classes were taken over from
    Wikidata as stubs. Each class shows its Wikidata equivalent (P4). The CIDOC CRM class
    crmdig:D14 (software) is stated for software (Q100) and Little Minion (Q105) and inherited by the
    classes below them. Chublet (Q106) has two parents, Little Minion and research software. The
    hierarchy is the one recorded in the model (P1); it has not been checked against Wikidata.
  alt: >-
    Left-to-right tree of the 13 classes with Instance as root, software with seven subclasses,
    Little Minion with the chublet class, and the built-in classes Class and Property.
  sources: [chublets-wikibase-demo, wikibase-static]

property-origin:
  caption: >-
    Origin of the {n_props} properties of the chublets Wikibase by origin in the CodeMeta-Wikidata crosswalk:
    {n_crosswalked} crosswalked (a CodeMeta term with a Wikidata twin), {n_codemeta_only} CodeMeta only,
    {n_wikidata_only} Wikidata only, {n_chublets_addition} chublets additions that are in neither
    vocabulary, and {n_no_status} kernel and review properties that are not part of the crosswalk. The bars below show
    how many properties of each group carry a Wikidata twin (P4), a loose Wikidata close match (P100),
    a CodeMeta term, a schema.org term (P102) and a DataCite element. DataCite (dashed) is derived via
    the CodeMeta hub and is not a published mapping.
  alt: >-
    Stacked bar of 168 properties in five coloured groups with five rows of evidence bars beneath
    showing how many properties of each group have a Wikidata, CodeMeta, schema.org or DataCite counterpart.
  sources: [chublets-wikibase-demo]

property-topics:
  caption: >-
    The {n_props} properties of the chublets Wikibase in {n_topics} topics. Each square is one property,
    coloured by its origin in the CodeMeta-Wikidata crosswalk: {n_crosswalked} crosswalked,
    {n_codemeta_only} CodeMeta only, {n_wikidata_only} Wikidata only, {n_chublets_addition} chublets
    additions and {n_no_status} unclassified built-in and later added properties. The topics were derived
    from the Wikidata WikiProject Informatics property groups, CodeMeta and schema.org; the examples are
    the first properties of each topic.
  alt: >-
    Fourteen rows, one per topic, each with a bar of coloured squares for its properties, the number of
    properties and a few example property names.
  sources: [chublets-wikibase-demo]

property-vocabulary-overlap:
  caption: >-
    Overlap of the two source vocabularies among the {n_props} properties. {n_twin} properties have an
    equivalent Wikidata property (P4) and {n_with_codemeta} have an equivalent CodeMeta term; the
    {n_crosswalked} crosswalked properties are in both. {n_codemeta_only} properties come from CodeMeta
    only and {n_wikidata_only} from Wikidata only; the remaining properties are chublets additions or
    built-in properties, some of them with a Wikidata property and some in neither vocabulary.
  alt: >-
    One bar of 168 properties in six coloured groups with a bracket above for the Wikidata properties
    and a bracket below for the CodeMeta terms, overlapping in the crosswalked properties.
  sources: [chublets-wikibase-demo]

entity-overview:
  caption: >-
    Contents of the chublets Wikibase: {n_classes} classes, {n_items} items and {n_props} properties.
    Items are instances of classes (P2) and carry statements that use the properties. Of the items,
    {n_chublet_items} are chublets, {n_other_items} are other items (topics, accounts, DOIs, URLs) and
    {n_items_no_class} have no class. {n_items_open_archaeo} items were imported from the open-archaeo
    list, {n_items_wikidata} were taken over from Wikidata and {n_items_stub} are stubs for Wikidata
    entities. In total the entities carry {n_statements} statements.
  alt: >-
    Three boxes for classes, items and properties, connected by arrows for instance of and statements,
    with the items split by class and by origin.
  sources: [chublets-wikibase-demo, wikibase-static]

property-metadata-layer:
  caption: >-
    The metadata layer of a property. A property of the chublets Wikibase is itself an entity and carries
    statements; the example is the property "programmed in" (P123). Bars show for how many of the
    {n_props} properties each statement exists: Wikidata equivalent (P4) {n_meta_p4}, close match
    (P100) {n_meta_p100}, equivalent CodeMeta term (P101) {n_meta_p101}, equivalent schema.org term (P102)
    {n_meta_p102}, domain (P9) {n_meta_p9}, range (P10) {n_meta_p10} and formatter URL (P5) {n_meta_p5}.
  alt: >-
    Amber box for the example property above seven rows, each naming a statement on the property, an example
    value and a bar for how many properties have it.
  sources: [chublets-wikibase-demo, wikibase-static]

chublet-item:
  caption: >-
    A chublet as an item of the Wikibase: {item_label} ({item_id}) with {n_item_statements} statements,
    of which a selection is shown. Class values are drawn in orange, item values in grey, literals as plain
    text; qualifiers appear below the statement they qualify, and every statement carries references. The
    item has {n_item_versions} statements for software versions, of which the preferred one is shown.
  alt: >-
    Item card with the title, the statements instance of, Wikidata equivalent, developer, programmed in,
    repository URL, version, DOI and website, with chips for classes and items and reference counts.
  sources: [chublets-wikibase-demo]

statement-provenance:
  caption: >-
    Provenance of statements. Left: one statement (a version of SPARQLing Unicorn QGIS Plugin) with its
    qualifiers and two groups of references. Right: of the {n_statements} statements in the Wikibase,
    {n_with_ref} carry at least one reference and {n_with_qual} at least one qualifier; {n_origin_oa}
    statements were imported from the open-archaeo list and {n_origin_wd} were taken over from Wikidata.
  alt: >-
    Boxes for a statement, its qualifiers and two references on the left, and three bar groups for origin,
    references and qualifiers on the right.
  sources: [chublets-wikibase-demo, wikibase-static]

codemeta-coverage:
  caption: >-
    Coverage of the {n_codemeta_terms} CodeMeta terms, grouped by the CodeMeta type they belong to.
    {n_crosswalked} terms are crosswalked to a Wikidata property (purple); {n_codemeta_only} terms exist in
    CodeMeta only (teal). All of them are properties of the chublets Wikibase.
  alt: >-
    Rows per CodeMeta type, each with one coloured chip per term, purple for crosswalked terms and teal for
    terms without a Wikidata property.
  sources: [chublets-wikibase-demo]
